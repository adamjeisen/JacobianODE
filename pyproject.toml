[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "JacobianODE"
version = "0.1.0"
description = "A package for Jacobian-based ODE analysis"
authors = [
  {name = "Adam J. Eisen", email = "eisenaj@mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    # torch / torchvision / torchaudio are declared in [dependency-groups]
    # below (cu128 by default, cu118 opt-in) so the CUDA build can be
    # selected per-machine. See [tool.uv] for the conflict + index setup.
    "lightning>=2.0.0",
    "jupyter",
    "jupyterlab",
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "colorcet",
    "tqdm",
    "cython",
    "hydra-core",
    "hydra-submitit-launcher",
    "hydra-optuna-sweeper",
    "wandb>=0.25.0",
    "OmegaConf",
    "torchquad",
    "torchdiffeq",
    "sdeint",
    "torchcubicspline @ git+https://github.com/patrick-kidger/torchcubicspline.git",
    "nbconvert",
    "wmtask @ git+ssh://git@github.com/adamjeisen/wmtask.git",
    "marimo>=0.22.4",
]

[project.optional-dependencies]
marimo = ["marimo>=0.20.0"]

[tool.marimo.runtime]
auto_reload = "lazy"

[dependency-groups]
dev = [
    "ipdb",
    "ipykernel>=7.1.0",
    "jupytext>=1.19.1",
    "pytest>=9.0.2",
]
cu128 = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
]
cu118 = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "nvidia-cudnn-cu12>=9.1",  # cu118 torch 2.7+ needs libcudnn.so.9; the cu11 wheel is a broken stub
]

[tool.uv]
# cu128 is the default GPU build. To install the cu118 build instead
# (e.g. on a Pascal GPU), run:
#   uv sync --no-group cu128 --group cu118
default-groups = ["dev", "cu128"]
conflicts = [
    [
        { group = "cu118" },
        { group = "cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu118", group = "cu118" },
]
torchvision = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu118", group = "cu118" },
]
torchaudio = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu118", group = "cu118" },
]
