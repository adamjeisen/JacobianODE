batch_size: 16
run_number: 0

# -----------------
# SLIDING WINDOW BATCHING
# -----------------
# For sequence-based encoders: raw trajectories (K x T_tot x D) are
# batched into sliding windows of length batch_window_length, spaced
# by batch_stride steps.  Set to null to disable (use full trajectories).
batch_window_length: null
batch_stride: null

lightning:
  _target_: null

  # -----------------
  # OPTIMIZATION
  # -----------------
  optimizer: 'AdamW'
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-4
  use_scheduler: True
  # use_scheduler: False
  min_lr: 1e-6 # minimum learning rate for use with scheduler
  # ADVANCED HYPERPARAMETERS
  k_scale: 1 # controls the slope of the learning rate scheduler
  gradient_clip_val: 1.0
  gradient_clip_algorithm: 'norm'

  # -----------------
  # TEACHER FORCING
  # -----------------
  # ADVANCED HYPERPARAMETERS
  alpha_teacher_forcing: 1
  teacher_forcing_annealing: True
  gamma_teacher_forcing: 0.999
  teacher_forcing_update_interval: 5
  teacher_forcing_steps: 1
  min_alpha_teacher_forcing: 0
  alpha_validation: 0

  # -----------------
  # TRAINING NOISE
  # -----------------
  # obs_noise_scale: 5e-2
  obs_noise_scale: 0
  latent_noise_scale: 0  # isotropic noise added to latent embeddings before JacobianODE propagation (latent model only)
  latent_noise_per_step: false  # false = same offset for all timesteps (manifold displacement); true = independent noise each step
  precompute_latent_noise_factor: true  # true = precompute scale factor from training data; false = compute per-batch on-the-fly
  
  # -----------------
  # JACOBIAN REGULARIZATION
  # -----------------
  jac_penalty: 0.0
  jac_norm_ord: 'fro'
  jac_consistency_weight: 0.0  # weight for ||e^{J dt}(z_{t+1}-z_t) - (z_{t+2}-z_{t+1})||^2 / var(z)
  fnn_weight: 0.0  # weight for FNN latent-geometry regularizer (Gilpin NeurIPS 2020)
  fnn_normalize: false        # normalize FNN loss by activation variance
  fnn_elementwise_regularization: false  # elementwise FNN: E[W*A^2] vs E[W]*E[A^2]
  fnn_use_pca: false         # project onto PCA before FNN for rotation invariance
  fnn_n_samples: 1024        # max points for FNN (O(N²)); null = use all

  # -----------------
  # SUBSPACE SPLITTING (for dimension-preserving encoders)
  # -----------------
  kl_divergence_weight: 0.0    # unified KL weight (null-space MSE + optional VAE KL)
  reconstruction_mode: 'uniform'  # 'uniform' | 'harmonic' | 'most_recent'

  # -----------------
  # TANGENT SPACE ENTROPY
  # -----------------
  tangent_entropy_weight: 0.0
  tangent_entropy_mode: 'quadratic'   # 'shannon' | 'quadratic' | 'renyi_half'
  tangent_entropy_n_samples: 256

  # -----------------
  # HOMOSCEDASTIC UNCERTAINTY WEIGHTING (Kendall et al. 2018)
  # When enabled, the fixed weight for a loss group is replaced by a
  # learnable log-variance s_i; the contribution becomes:
  #   0.5 * exp(-s_i) * L_i + 0.5 * s_i
  # log_var_init controls initialisation:
  #   'naive' -> s_i = 0  (effective weight = 1 for all groups)
  #   'auto'  -> s_i = log(initial_loss_magnitude)  (prevents first-step gradient spikes)
  # -----------------
  learn_r2_weight: false            # learn weight for R²-like loss group (traj + recon + latent_pred)
  learn_loop_closure_weight: false  # learn weight for loop closure loss
  learn_fnn_weight: false           # learn weight for FNN regularization loss
  learn_jac_cons_weight: false      # learn weight for Jacobian consistency loss
  learn_jac_norm_weight: false      # learn weight for Jacobian norm penalty
  log_var_init: 'naive'             # 'naive' or 'auto'
  
  # -----------------
  # LOOP CLOSURE TRAINING
  # -----------------
  # -----------------
  # RECONSTRUCTION LOSS
  # -----------------
  reconstruction_loss_weight: 1.0  # weight for decode(encode(x)) ≈ x loss in obs space
  latent_prediction_loss_weight: 0.0  # weight for JacobianODE(z_t) ≈ z_{t+k} loss in latent space

  loop_closure_training: True # whether to train on loop closure integrals
  loop_closure_weight: 0.0
  n_loop_pts: 20 # number of points per loop
  # ADVANCED HYPERPARAMETERS
  mix_trajectories: True # whether to mix trajectories during training
  loop_closure_interp_pts: 20 # number of interpolation points in between end points for each line segment
  loop_closure_int_method: 'Trapezoid'
  n_loops: null # set default to traj batches

  # -----------------
  # JACOBIAN ODE
  # -----------------
  # ADVANCED HYPERPARAMETERS
  jacobianODEint_kwargs:
    # -----------------
    # FAST MODE
    # -----------------
    traj_init_steps: 15
    inner_path: 'line'
    inner_N: 20
    interp_pts: 4

  log_interval: 100
  trajectory_training: True
  use_base_deriv_pt: False
  # direct: False
  direct: True
  loss_func: mse
  data_type: null
  
logger_save_dirs: null

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: null
  log_model: True
  
trainer_params:
  # limit_train_batches: 1.0
  limit_train_batches: 500
  limit_val_batches: 100
  max_epochs: 1000
  accumulate_grad_batches: 4
  # strategy: 'ddp_find_unused_parameters_true'

early_stopping:
  min_epochs: 0  # Training runs at least this many epochs before early stopping can trigger
  early_stopping_patience: 2
  # early_stopping_mode: 'min'
  early_stopping_mode: 'percent_thresh'
  percent_thresh: 0.01
  monitor: 'mean val loss'
  mode: 'min'

model_checkpoint:
  save_top_k: 1
  monitor: 'mean val loss'
  mode: 'min'
