batch_size: 16
run_number: 0

# -----------------
# SLIDING WINDOW BATCHING
# -----------------
# For sequence-based encoders: raw trajectories (K x T_tot x D) are
# batched into sliding windows of length batch_window_length, spaced
# by batch_stride steps.  Set to null to disable (use full trajectories).
batch_window_length: null
batch_stride: null

lightning:
  _target_: null

  # -----------------
  # OPTIMIZATION
  # -----------------
  optimizer: 'AdamW'
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-4
  use_scheduler: True
  # use_scheduler: False
  scheduler_type: cosine  # 'cosine' (CosineAnnealingLR over max_epochs) or 'teacher_forcing' (legacy)
  min_lr: 1e-6 # minimum learning rate (eta_min for cosine, floor for teacher_forcing)
  # ADVANCED HYPERPARAMETERS
  k_scale: 1 # controls the slope of the learning rate scheduler (teacher_forcing only)
  gradient_clip_val: 1.0
  gradient_clip_algorithm: 'norm'

  # -----------------
  # TEACHER FORCING
  # -----------------
  # ADVANCED HYPERPARAMETERS
  alpha_teacher_forcing: 1
  teacher_forcing_annealing: True
  gamma_teacher_forcing: 0.999
  teacher_forcing_update_interval: 5
  teacher_forcing_steps: 1
  min_alpha_teacher_forcing: 0
  alpha_validation: 0

  # -----------------
  # TRAINING NOISE
  # -----------------
  # obs_noise_scale: 5e-2
  obs_noise_scale: 0
  latent_noise_scale: 0  # isotropic noise added to latent embeddings before JacobianODE propagation (latent model only)
  latent_noise_per_step: false  # false = same offset for all timesteps (manifold displacement); true = independent noise each step
  precompute_latent_noise_factor: true  # true = precompute scale factor from training data; false = compute per-batch on-the-fly
  
  # -----------------
  # JACOBIAN REGULARIZATION
  # -----------------
  jac_penalty: 0.0
  jac_norm_ord: 'fro'
  jac_consistency_weight: 0.0  # weight for ||e^{J dt}(z_{t+1}-z_t) - (z_{t+2}-z_{t+1})||^2 / var(z)
  fnn_weight: 0.0  # weight for FNN latent-geometry regularizer (Gilpin NeurIPS 2020)
  fnn_normalize: true        # normalize FNN loss by activation variance
  fnn_elementwise_regularization: true  # elementwise FNN: E[W*A^2] vs E[W]*E[A^2]
  fnn_use_pca: true         # project onto PCA before FNN for rotation invariance
  fnn_n_samples: 1024        # max points for FNN (O(N²)); null = use all

  # -----------------
  # SUBSPACE SPLITTING (for dimension-preserving encoders)
  # -----------------
  kl_null_weight: null           # null-space MSE penalty; null = same as kl_dyn_weight
  kl_dyn_weight: 0.0            # dynamic subspace KL divergence (smoothness regularizer)
  reconstruction_mode: 'most_recent'  # 'uniform' | 'harmonic' | 'most_recent'

  # -----------------
  # TANGENT SPACE ENTROPY
  # -----------------
  tangent_entropy_weight: 0.0
  tangent_entropy_mode: 'quadratic'   # 'shannon' | 'quadratic' | 'renyi_half'
  tangent_entropy_n_samples: 256

  # -----------------
  # DIFFEOMORPHISM CYCLE-CONSISTENCY (for non-bijective encoders)
  # -----------------
  diffeomorphism_weight: 0.0  # soft penalty on E∘D ≈ id and D∘E ≈ id

  # Number of B×T Jacobian matrices to randomly sample for eigenvalue
  # computation during validation. Reduces val cost when B*T is large.
  # Set to null to use all B*T matrices.
  n_eigval_jacobians: null

  # -----------------
  # HOMOSCEDASTIC UNCERTAINTY WEIGHTING (Kendall et al. 2018)
  # When enabled, the fixed weight for a loss group is replaced by a
  # learnable log-variance s_i; the contribution becomes:
  #   0.5 * exp(-s_i) * L_i + 0.5 * s_i
  # log_var_init controls initialisation:
  #   'naive' -> s_i = 0  (effective weight = 1 for all groups)
  #   'auto'  -> s_i = log(initial_loss_magnitude)  (prevents first-step gradient spikes)
  # -----------------
  learn_r2_weight: false            # learn weight for R²-like loss group (traj + recon + latent_pred)
  learn_loop_closure_weight: false  # learn weight for loop closure loss
  learn_fnn_weight: false           # learn weight for FNN regularization loss
  learn_jac_cons_weight: false      # learn weight for Jacobian consistency loss
  learn_jac_norm_weight: false      # learn weight for Jacobian norm penalty
  log_var_init: 'auto'             # 'naive' or 'auto'
  
  # -----------------
  # LOOP CLOSURE TRAINING
  # -----------------
  # -----------------
  # RECONSTRUCTION LOSS
  # -----------------
  reconstruction_loss_weight: 1.0  # weight for decode(encode(x)) ≈ x loss in obs space
  latent_prediction_loss_weight: 1.0  # weight for JacobianODE(z_t) ≈ z_{t+k} loss in latent space

  loop_closure_training: True # whether to train on loop closure integrals
  loop_closure_weight: 0.0
  n_loop_pts: 20 # number of points per loop
  # ADVANCED HYPERPARAMETERS
  mix_trajectories: True # whether to mix trajectories during training
  loop_closure_interp_pts: 20 # number of interpolation points in between end points for each line segment
  loop_closure_int_method: 'Trapezoid'
  n_loops: null # set default to traj batches

  # -----------------
  # JACOBIAN ODE
  # -----------------
  # ADVANCED HYPERPARAMETERS
  jacobianODEint_kwargs:
    # -----------------
    # FAST MODE
    # -----------------
    traj_init_steps: 15
    inner_path: 'line'
    inner_N: 20
    interp_pts: 4

  log_interval: 100
  trajectory_training: True
  use_base_deriv_pt: False
  # direct: False
  direct: True
  loss_func: mse # mse | normalized_mse
  data_type: null

  # -----------------
  # W&B PROFILING
  # -----------------
  profile_output: null
  profile_steps: 1
  
logger_save_dirs: null

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: null
  # Model checkpoints are saved locally via ModelCheckpoint to logger_save_dirs
  # on engaging — no need to also upload them to wandb (they can be hundreds of
  # MB per run and quickly blow past the wandb storage quota). Flip back to True
  # only if you need cross-machine artifact distribution.
  log_model: False
  
trainer_params:
  # limit_train_batches: 1.0
  limit_train_batches: 500
  limit_val_batches: 100
  max_epochs: 1000
  accumulate_grad_batches: 4
  # strategy: 'ddp_find_unused_parameters_true'

# -----------------
# OPTUNA PRUNING
# -----------------
# When running an Optuna sweep with SQLite storage, trials can be pruned
# early if their validation loss at `optuna_prune_epoch` is worse than the
# median (or configured quantile) of completed trials' final objectives.
# Set to null to disable.  study_name and storage are passed via top-level
# config keys (optuna_study_name, optuna_storage).
optuna_prune_epoch: null          # epoch at which to check (e.g. 15)
optuna_prune_min_completed: 5     # need this many completed trials before pruning
optuna_prune_quantile: 0.5        # prune if worse than this quantile (0.5 = median)

# Constrained optimization: when set, the progress callback uses
# feasibility-aware tracking (feasible result always beats infeasible).
# Set constraint_metric to a logged metric name and constraint_threshold
# to the maximum acceptable value.  Set to null to disable (default).
optuna_constraint_metric: null        # e.g. "val/loop_closure_loss"
optuna_constraint_threshold: null     # e.g. sqrt(n_dynamic_dims)

early_stopping:
  min_epochs: 0  # Training runs at least this many epochs before early stopping can trigger
  early_stopping_patience: 2
  # early_stopping_mode: 'min'
  early_stopping_mode: 'percent_thresh'
  percent_thresh: 0.01
  monitor: 'mean val loss'
  mode: 'min'

model_checkpoint:
  save_top_k: 1
  monitor: 'mean val loss'
  mode: 'min'
