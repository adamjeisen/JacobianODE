# Base configuration for all data types
# Data should be in format: (n_trials, n_timepoints, n_dimensions)

flow:
  random_state: 42

postprocessing:
  obs_noise: 0
  filter_data: false
  # low_pass / high_pass defaults are null. The ragged training path
  # raises a clear ValueError if filter_data=true is passed without at
  # least one of these set; the legacy non-ragged path treats null as
  # "skip that side of the bandpass". Avoid setting non-null defaults
  # here so a typo'd `filter_data: true` doesn't silently apply some
  # arbitrary cutoff.
  low_pass: null
  high_pass: null
  normalize: false
  # Metadata fields populated at runtime by postprocess_data / run_jacobians.
  # Stored so that load_run can reconstruct the exact data pipeline.
  noise_scale_factor: null
  mu: null
  sigma: null

train_test_params:
  seq_length: 25       # Length of sequences for training
  seq_spacing: 1       # Spacing between sequence start points
  split_by: 'trajectory'  # 'trajectory' or 'time'
  train_percent: 0.7
  test_percent: 0.1
  # val_percent = 1 - train_percent - test_percent
  dtype: torch.FloatTensor
  verbose: true
  delay_embedding_params:
    observed_indices: 'all'  # 'all', 'random', or list of indices
    n_observed: null          # Number of dims to observe (required when observed_indices='random')
    partial_obs_seed: null    # Seed for random index selection (defaults to flow.random_state)
    n_delays: 1              # Number of delays for delay embedding
    delay_spacing: 1         # Time steps between delays
