# @package _global_
#
# Single-run companion to the broken n_delays=30 slot from the
# lorenz_partial_additive_mse_uniform_p30_obsnoise005__ndelays_sweep
# (run qxpj8xpn, frozen trajectory val_loss = 1.0996 at every epoch).
#
# Same config except permutation_seed = 5 instead of the default 42.
# At zero-init the additive coupling encoder is just a chain of
# FixedPermutations; with seed=42 the cumulative permutation chain
# routes none of z_dyn's input slots to decoded position 0 — the very
# position the validation loss measures in 'most_recent' mode. seed=5
# was found by enumeration to satisfy h^-1(0) ∈ {0,1,2} for n_input=30
# and 8 coupling layers, so decoded[0] = z_dyn[0] at init.
#
# Tests the hypothesis: with init guaranteeing a z_dyn → decoded[0]
# path, is uniform training loss alone sufficient to keep the optimizer
# in a basin where pos 0 stays sensitive to z_dyn (and so the
# trajectory rollout val loss stays meaningful)?

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    n_delays=30, LC=0, obs_noise=0.05, prediction_steps=30, p30 uniform
    reconstruction. Same config as the broken qxpj8xpn run from the
    obsnoise005 ndelays sweep, but with model.encoder.permutation_seed=5
    instead of the default 42. Single-run experiment.
  hypothesis: |
    The val/trajectory_loss freeze at n_delays=30 came from the
    permutation-seed-42 encoder leaving decoded[0] independent of z_dyn
    at init, which let the optimizer settle into a basin where decoded[0]
    is reconstructed from z_null only. Validation rollout holds z_null
    fixed, so the trajectory loss decouples from training. With
    permutation_seed=5, decoded[0] = z_dyn[0] at init, providing a
    direct gradient path from z_dyn to the only feature validation
    measures. If this is sufficient, training/val should agree and the
    rollout val loss should track training; if it isn't, we need a
    structural fix (matched val mode, hybrid loss, or a regularizer).
  success_criteria:
    - "trajectory val_loss is non-constant across epochs (the freeze pathology disappears)"
    - "trajectory val_loss reaches at least the level of the n_delays=25 / n_delays=35 runs in the same sweep"
    - "no training divergence"

sweep_grid: {}

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDsweep_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_25d_additive_mse_uniform_p30_obsnoise005_nd30_seed5"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 30
      delay_spacing: 1

model:
  n_target_dims: 3
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0
  encoder:
    permutation_seed: 5

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 0.0
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
