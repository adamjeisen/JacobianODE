# @package _global_
#
# SMOKE TEST for FNN-based autodim (model.n_target_dim_method=fnn).
# Single short run, Lorenz partial obs, n_delays=30, obs_noise=0.05.
# Known correct answer: n_target_dims=3 (whitened PCA-FNN k=1 stop-at-min
# returned 3 across all noise levels for n_delays in [15, 60]).
#
# Validates end-to-end: data load → autodim picks 3 → model factory builds
# at n_target=3 → training runs a few epochs → wandb logs n_target_dims_fnn_auto.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Lorenz partial-obs smoke for FNN autodim. n_delays=30, obs_noise=0.05,
    additive coupling, split-mode loss. 5 epochs only — purpose is to
    validate the FNN autodim code path, not to train a useful model.
  hypothesis: |
    With model.n_target_dim_method='fnn' and n_delays=30 (where the
    whitened-PCA-FNN k=1 stop-at-min diagnostic robustly returned dim=3
    across all noise levels), the autodim path should pick
    n_target_dims=3 and training should proceed without error.
  success_criteria:
    - "Autodim resolves to n_target_dims=3 (logged as n_target_dims_fnn_auto)"
    - "Run completes 5 epochs without divergence"

sweep_grid:
  training.lightning.loop_closure_weight: "1e-4"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDInitSweep_autodim_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_smoke_p30_nd30_fnnautodim"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 30
      delay_spacing: 1

model:
  n_target_dims: 3                      # fallback; FNN-auto should set this to 3
  n_target_dim_method: fnn              # NEW — opt-in FNN autodim
  n_target_fnn_threshold: 0.01          # default; explicit for record
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0
  trajectory_loss_most_recent: true
  encoder:
    final_perm_identity: true

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 5
    limit_train_batches: 50
    limit_val_batches: 20
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 1e-4
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
    jacobianODEint_kwargs:
      traj_init_steps: 15
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 5
