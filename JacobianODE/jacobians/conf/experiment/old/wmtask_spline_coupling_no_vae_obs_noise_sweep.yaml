# @package _global_
#
# Experiment: WMTask × SplineCoupling (no VAE) — loop-closure / obs-noise sweep
# -------------------------------------------------------------------------------
# Encoder : spline_coupling (RQS, 8 coupling layers, NO VAE)
# Data    : WMTask (delay2 window, all 128 dims, n_delays=1)
# Mode    : from_scratch
# Sweep   : loop_closure_weight × obs_noise_scale  (9 × 3 = 27 combinations)
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=wmtask_spline_coupling_no_vae_obs_noise_sweep

defaults:
  - override /data: wmtask
  - override /model: latent_spline_coupling
  - override /hydra/sweeper: grid_lc_obs_noise
  - _self_

metadata:
  description: |
    Spline coupling encoder on WMTask, NO VAE, from-scratch joint training.
    Sweeps loop_closure_weight × obs_noise_scale (9×3 = 27 runs). Deterministic
    baseline for comparing against the VAE-enabled spline coupling runs.
  hypothesis: |
    Without VAE regularization, the spline encoder should learn a cleaner
    deterministic mapping. The sweep reveals how obs noise interacts with
    loop-closure regularization for this encoder class.
  success_criteria:
    - "At least one configuration achieves strong trajectory prediction"
    - "Sensitivity to obs_noise_scale is interpretable"
    - "Baseline for VAE comparison is clearly established"

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

# Project encodes: data source, observed dims, delay params, normalization, latent dim, encoder
wandb_project: "WMTask_IND${data.train_test_params.delay_embedding_params.observed_indices}_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__JacobianODE"

# Group encodes: what is swept + key fixed hyperparams
wandb_group: "spline_coupling_no_vae__sweep_lc_x_obs_noise_${model.prediction_steps}step_cleantarget"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.05    # default 0.1
    normalize: true    # default false
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      observed_indices: 'all'   # fully observed (all 128 dims)
      n_delays: 1               # no delay embedding
      delay_spacing: 1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 128        # full WMTask dim; default 3
  prediction_steps: 30      # default 10
  encoder_warmup_epochs: 5  # default 0
  use_vae: false            # no VAE — deterministic encoder
  vae_sample_all_losses: false
  kl_null_weight: 1.0       # null-space MSE penalty (structural constraint, typical for non-VAE)

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32    # default 16
  trainer_params:
    max_epochs: 150              # default 1000
    limit_train_batches: 200     # default 500
    limit_val_batches: 50        # default 100
    accumulate_grad_batches: 4
  lightning:
    # obs_noise_scale swept via grid_lc_obs_noise sweeper
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5    # default 2
    min_epochs: 10                # default 0
