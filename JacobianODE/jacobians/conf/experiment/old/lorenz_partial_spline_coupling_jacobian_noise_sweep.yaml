# @package _global_
#
# Experiment: Lorenz × SplineCoupling + Jacobian Noise — loop-closure / KL sweep
# ---------------------------------------------------------------------------------
# Encoder : spline_coupling (RQS, 8 coupling layers, VAE on dynamic subspace)
# Data    : Lorenz, partial observation (dim 0 only), 25-step delay embedding
# Latent  : 3D dynamic subspace, no null space
# Noise   : jacobian_noise enabled (parameter-free orthogonalized Jacobian routing)
# Sweep   : loop_closure_weight × kl_dyn_weight  (9 × 9 = 81 combinations)
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=lorenz_partial_spline_coupling_jacobian_noise_sweep_many_step

defaults:
  - override /data: dysts
  - override /model: latent_spline_coupling
  - override /hydra/sweeper: grid_lc_kl
  - _self_

metadata:
  description: |
    Lorenz with partial observation + delay embedding, spline coupling encoder
    with jacobian_noise (parameter-free orthogonalized Jacobian noise routing).
    Sweeps loop_closure_weight × kl_dyn_weight (81 runs). Compares against
    geometric_noise version.
  hypothesis: |
    Parameter-free Jacobian-based noise routing gets the benefits of
    anisotropic noise (from the learned dynamics) without adding a separate
    trainable flow, reducing model complexity while maintaining geometric
    noise benefits.
  success_criteria:
    - "Matches or exceeds geometric_noise baseline on Lyapunov spectrum recovery"
    - "No additional trainable parameters vs plain spline coupling"
    - "Trajectory prediction remains strong"

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

wandb_project: "Lorenz_PARTIAL_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__JacobianODE"

wandb_group: "spline_coupling__jacobian_noise__sweep_lc_x_kl_dyn_30step"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      observed_indices: [0]   # dim 0 only (Lorenz x-coordinate)
      n_delays: 25            # 25-step delay embedding -> 25D input
      delay_spacing: 1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 3              # full 3D dynamic subspace, no null space
  prediction_steps: 30
  encoder_warmup_epochs: 5
  vae_sample_all_losses: true   # critical: downstream losses must see noisy z
  geometric_noise:
    enabled: false
  jacobian_noise:
    enabled: true
    lookahead_steps: null        # defaults to prediction_steps (30)
    orthogonalize: true

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 150
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    n_eigval_jacobians: 8        # number of validation samples for eigenvalue diagnostics
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 10
