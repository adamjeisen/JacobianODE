# @package _global_
#
# Experiment: WMTask — MLP diffeomorphism encoder, frozen after warmup
# -------------------------------------------------------------------------------
# Tests gradient flow through a standard MLP encoder/decoder.
# Unlike coupling flows, the MLP is not invertible by construction —
# invertibility is enforced via diffeomorphism cycle-consistency loss
# during encoder warmup. After warmup, the encoder is frozen and only
# dynamics are trained.
#
# Standard MLP backprop (W^T at each layer) gives clean, well-conditioned
# gradients without the spline derivative distortion or affine scaling issues.

defaults:
  - override /data: wmtask
  - override /model: latent_mlp_diffeo
  - _self_

metadata:
  description: |
    MLP encoder/decoder (not invertible by construction) with diffeomorphism
    cycle-consistency penalty enforcing approximate invertibility. Encoder
    is warmed up for 20 epochs with recon + diffeo loss, then frozen while
    dynamics are trained. Tests whether standard MLP backprop outperforms
    coupling-flow architectures for gradient conditioning.
  hypothesis: |
    Standard MLP backprop (W^T per layer, well-conditioned with modern init)
    should give cleaner gradients than coupling flows, potentially
    outperforming even the identity coupling baselines.
  success_criteria:
    - "MASE after warmup+freeze reaches or beats vanilla baseline"
    - "Training is stable through the warmup → dynamics transition"
    - "Diffeomorphism loss stays low throughout training"

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "mlp_diffeo_frozen__lc1e-4_obs0.05"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: false
  train_test_params:
    seq_length: 25
    delay_embedding_params:
      observed_indices: 'all'
      n_delays: 1
      delay_spacing: 1

model:
  n_target_dims: 128
  prediction_steps: 10
  encoder_warmup_epochs: 20     # train autoencoder + diffeomorphism first
  dynamics_warmup_epochs: 9999  # freeze encoder for entire dynamics phase
  use_vae: false
  vae_sample_all_losses: false
  kl_null_weight: null
  kl_dyn_weight: 0.0

training:
  batch_size: 16
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  trainer_params:
    max_epochs: 1000
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 4
  lightning:
    loss_func: mse
    obs_noise_scale: 0.05
    loop_closure_weight: 0.0001
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 0.0
    diffeomorphism_weight: 10.0   # strong cycle-consistency during warmup
  early_stopping:
    early_stopping_patience: 2
    min_epochs: 25                # don't stop during encoder warmup
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
