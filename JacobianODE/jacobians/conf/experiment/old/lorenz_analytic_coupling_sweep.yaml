# @package _global_
#
# Experiment: Lorenz × Cubic-Rational Coupling — delay-100 / dim-0 partial obs
# -----------------------------------------------------------------------
# Encoder : cubic_rational_coupling  (analytic C-inf bijection, 8 layers, VAE)
# Data    : Lorenz, observed dim 0 only, 100-delay embedding (spacing=1)
# Mode    : from_scratch
# Target  : 3 dynamic dimensions (true Lorenz dimensionality)
# Sweep   : loop_closure_weight × kl_dyn_weight  (9 × 9 = 81 combinations)
#
# Encoder choice — cubic_rational over sinh and cubic_conjugation:
#   - Lorenz is a bounded, smooth strange attractor; no benefit from sinh's
#     heavy-tail robustness
#   - Cubic rational bijections have higher approximation power per coupling
#     layer than sinh conjugation for smooth, symmetric distributions
#   - More expressive per-layer capacity helps when collapsing 100D → 3D
#     dynamic subspace across 8 coupling layers
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=lorenz_analytic_coupling_sweep

defaults:
  - override /data: dysts
  - override /model: latent_cubic_rational_coupling
  - _self_

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

wandb_project: "Lorenz_IND0_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__cubic_rat_coupling__JacobianODE"

wandb_group: "cubic_rat_coupling__sweep_lc_x_kl_dyn"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.01    # default 0
    normalize: true    # default false
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      observed_indices: [0]   # dim 0 only (Lorenz x-coordinate)
      n_delays: 100           # 100-step delay embedding → 100D input
      delay_spacing: 1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 7          # true Lorenz dimensionality; default 3
  prediction_steps: 30      # default 10
  encoder_warmup_epochs: 5  # default 0

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32    # default 16
  trainer_params:
    max_epochs: 150            # default 1000
    limit_train_batches: 200   # default 500
    limit_val_batches: 50      # default 100
  lightning:
    # loop_closure_weight: 0.001
    # kl_dyn_weight: 0.001
    loop_closure_weight: 0
    kl_dyn_weight: 0
    n_eigval_jacobians: 8     # default null
  early_stopping:
    early_stopping_patience: 5  # default 2
    min_epochs: 10              # default 0

# # ── Sweep grid ────────────────────────────────────────────────────────────────
