# @package _global_
#
# Experiment: WMTask — Affine coupling, identity init, frozen
# -------------------------------------------------------------------------------
# Affine coupling with zero_init=true gives exact identity (scale=1, shift=0).
# The only non-identity part is dimension permutations between layers.
# This is the cleanest possible latent pipeline test.

defaults:
  - override /data: wmtask
  - override /model: latent_spline_coupling
  - _self_

metadata:
  description: |
    Affine coupling with zero_init=true, no actnorm, frozen. The affine coupling
    at zero_init is exactly identity (scale=1, shift=0), so the whole encoder
    reduces to a dimension permutation. Cleanest possible test of the latent
    pipeline — any gap vs. vanilla JacobianODE is a latent-pipeline bug.
  hypothesis: |
    Since the encoder is effectively a permutation (orthogonal, det=1), the
    latent model's performance should match vanilla JacobianODE exactly.
  success_criteria:
    - "val/trajectory_mase matches vanilla baseline (~0.86)"
    - "val/loop_closure_loss behaves like vanilla (no spikes)"
    - "val/trajectory_r2_score matches vanilla (~0.991)"

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "affine_trivial_frozen__lc1e-4_obs0.05"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: false
  train_test_params:
    seq_length: 25
    delay_embedding_params:
      observed_indices: 'all'
      n_delays: 1
      delay_spacing: 1

model:
  encoder:
    coupling_type: affine
    zero_init: true
    use_actnorm: false
  n_target_dims: 128
  prediction_steps: 10
  encoder_warmup_epochs: 0
  dynamics_warmup_epochs: 9999
  use_vae: false
  vae_sample_all_losses: false
  kl_null_weight: null
  kl_dyn_weight: 0.0

training:
  batch_size: 16
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  trainer_params:
    max_epochs: 1000
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 4
  lightning:
    loss_func: mse
    obs_noise_scale: 0.05
    loop_closure_weight: 0.0001
    loop_closure_training: true
    reconstruction_loss_weight: 0.0
    latent_prediction_loss_weight: 0.0
  early_stopping:
    early_stopping_patience: 2
    min_epochs: 0
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
