# @package _global_
#
# obs_noise=0.01 counterpart to ..._obsnoise005_nd30_seed5: tests the
# same seed-init fix on the broken n_delays=30 slot from the
# obsnoise001 ndelays sweep (run 2eyziq6e, frozen
# trajectory val_loss = 1.0986 at every epoch).

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    n_delays=30, LC=0, obs_noise=0.01, prediction_steps=30, p30 uniform
    reconstruction. Same config as the broken 2eyziq6e run but with
    model.encoder.permutation_seed=5 — chosen so the cumulative encoder
    permutation chain at zero-init routes z_dyn[0] directly to
    decoded[0], guaranteeing a non-zero ∂decoded[0]/∂z_dyn at init.
    Single-run experiment.
  hypothesis: |
    See ..._obsnoise005_nd30_seed5. Same hypothesis at the lower noise
    level — included to control for whether the seed fix is sensitive to
    obs_noise. If both noise levels train cleanly, the init alone is
    sufficient and we can keep training on uniform loss only. If only
    one trains, that's evidence that noise-driven optimization pressure
    is required to push the model into the bad attractor (and hence
    that the loss-asymmetry fix is the real one).
  success_criteria:
    - "trajectory val_loss is non-constant across epochs"
    - "trajectory val_loss reaches at least the level of the n_delays=25 / n_delays=35 runs in the obsnoise001 ndelays sweep"
    - "no training divergence"

sweep_grid: {}

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDsweep_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_25d_additive_mse_uniform_p30_obsnoise001_nd30_seed5"

data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 30
      delay_spacing: 1

model:
  n_target_dims: 3
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0
  encoder:
    permutation_seed: 5

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 0.0
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
