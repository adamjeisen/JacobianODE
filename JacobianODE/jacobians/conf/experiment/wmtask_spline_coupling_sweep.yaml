# @package _global_
#
# Experiment: WMTask × SplineCoupling — loop-closure / KL-dynamic sweep
# -----------------------------------------------------------------------
# Encoder : spline_coupling (RQS, 8 coupling layers, VAE on dynamic subspace)
# Data    : WMTask (delay2 window, all 128 dims, n_delays=1)
# Mode    : from_scratch
# Sweep   : loop_closure_weight × kl_dyn_weight  (9 × 9 = 81 combinations)
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=wmtask_spline_coupling_sweep

defaults:
  - override /data: wmtask
  - override /model: latent_spline_coupling
  - override /hydra/sweeper: grid_lc_kl
  - _self_

metadata:
  description: |
    Spline coupling encoder on WMTask, from-scratch joint training. Sweeps
    loop_closure_weight × kl_dyn_weight (9×9 = 81 runs). Uses VAE on the
    dynamic subspace. Earlier exploration of spline coupling as the encoder.
  hypothesis: |
    There exists a combination of loop-closure and KL-dynamic weights that
    yields good trajectory prediction while learning a reasonable latent
    dynamics representation on WMTask.
  success_criteria:
    - "At least one configuration achieves strong trajectory prediction (R² > 0.95)"
    - "KL sweep reveals a sensitivity curve around dynamic-subspace smoothness"
    - "Loop closure converges for well-tuned LC weights"

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

# Project encodes: data source, observed dims, delay params, normalization, latent dim, encoder
wandb_project: "WMTask_IND${data.train_test_params.delay_embedding_params.observed_indices}_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__JacobianODE"

# Group encodes: what is swept + key fixed hyperparams
wandb_group: "spline_coupling__sweep_lc_x_kl_dyn_${model.prediction_steps}step_cleantarget"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.05    # default 0.1
    normalize: true    # default false
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      observed_indices: 'all'   # fully observed (all 128 dims)
      n_delays: 1               # no delay embedding
      delay_spacing: 1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 128        # full WMTask dim; default 3
  prediction_steps: 30      # default 10
  encoder_warmup_epochs: 5  # default 0
  vae_sample_all_losses: true

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32    # default 16
  trainer_params:
    max_epochs: 150              # default 1000
    limit_train_batches: 200     # default 500
    limit_val_batches: 50        # default 100
    accumulate_grad_batches: 4
  lightning:
    # loop_closure_weight: 0.001
    # kl_dyn_weight: 0.001
    # n_eigval_jacobians: 128      # default null
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5    # default 2
    min_epochs: 10                # default 0

