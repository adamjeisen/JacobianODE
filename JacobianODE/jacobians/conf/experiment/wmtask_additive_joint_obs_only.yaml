# @package _global_
#
# Experiment: WMTask — Additive coupling, joint encoder+dynamics training
# -------------------------------------------------------------------------------
# 5 epochs encoder warmup (reconstruction only), then joint training of
# encoder and Jacobian dynamics. Observation-space prediction loss only
# (no latent prediction loss). Tests whether additive coupling supports
# stable joint training with clean gradient flow.

defaults:
  - override /data: wmtask
  - override /model: latent_spline_coupling
  - _self_

metadata:
  description: |
    First real joint-training test: additive coupling (zero_init), 5 epochs
    encoder warmup, then encoder + Jacobian model trained together.
    Observation-space MSE loss only (latent_prediction_loss_weight = 0).
    Uses MSE as criterion.
  hypothesis: |
    Additive coupling's clean gradient flow + no lpl competition should give
    stable joint training. Loop closure remains bounded; MASE approaches or
    beats vanilla baseline.
  success_criteria:
    - "val/trajectory_mase < 0.86 (matches or beats vanilla)"
    - "No loop closure explosion during encoder warmup → joint transition"
    - "recon_loss stays near zero (encoder remains effectively invertible)"

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "additive_joint_obs_only__lc1e-4_obs0.05"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: false
  train_test_params:
    seq_length: 25
    delay_embedding_params:
      observed_indices: 'all'
      n_delays: 1
      delay_spacing: 1

model:
  encoder:
    coupling_type: additive
    zero_init: true
    use_actnorm: false
  n_target_dims: 128
  prediction_steps: 10
  encoder_warmup_epochs: 5
  dynamics_warmup_epochs: 0      # joint training immediately after warmup
  use_vae: false
  vae_sample_all_losses: false
  kl_null_weight: null
  kl_dyn_weight: 0.0

training:
  batch_size: 16
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  trainer_params:
    max_epochs: 1000
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 4
  lightning:
    loss_func: mse
    obs_noise_scale: 0.05
    loop_closure_weight: 0.0001
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 0.0
  early_stopping:
    early_stopping_patience: 2
    min_epochs: 10               # don't stop during/right after warmup
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
