# @package _global_
#
# Experiment: WMTask — Additive coupling, joint training WITH latent pred loss
# -------------------------------------------------------------------------------
# Same as wmtask_additive_joint_obs_only but with latent_prediction_loss_weight=1.0.
# Tests whether the latent prediction loss (which broke loop closure in frozen
# encoder experiments) is also harmful during joint training, or whether the
# trainable encoder can adapt to compensate.

defaults:
  - override /data: wmtask
  - override /model: latent_spline_coupling
  - _self_

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "additive_joint_with_lpl__lc1e-4_obs0.05"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: false
  train_test_params:
    seq_length: 25
    delay_embedding_params:
      observed_indices: 'all'
      n_delays: 1
      delay_spacing: 1

model:
  encoder:
    coupling_type: additive
    zero_init: true
    use_actnorm: false
  n_target_dims: 128
  prediction_steps: 10
  encoder_warmup_epochs: 5
  dynamics_warmup_epochs: 0      # joint training immediately after warmup
  use_vae: false
  vae_sample_all_losses: false
  kl_null_weight: null
  kl_dyn_weight: 0.0

training:
  batch_size: 16
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  trainer_params:
    max_epochs: 1000
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 4
  lightning:
    loss_func: mse
    obs_noise_scale: 0.05
    loop_closure_weight: 0.0001
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
  early_stopping:
    early_stopping_patience: 2
    min_epochs: 10               # don't stop during/right after warmup
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
