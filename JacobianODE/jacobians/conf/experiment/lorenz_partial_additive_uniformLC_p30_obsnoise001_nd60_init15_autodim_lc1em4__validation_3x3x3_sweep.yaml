# @package _global_
#
# Overnight 27-run validation sweep around the obsnoise001 winner of the
# uniform LC sweep (ccvot8j5: n_delays=60, LC=1e-4, splitmode in effect,
# final_perm_identity=true, init_pca_basis=false, LPL=1, recon_w=1,
# best_traj=3.98e-4, passes C1+C2+C3). Submitted to ou_bcs_normal so at
# least one cell completes overnight.
#
# Sweeps three new axes:
#   - obs_noise_scale: spot-check at the winning (n_delays, LC) cell
#   - reconstruction_loss_weight: tests recon vs traj scale balance under split-mode
#   - latent_prediction_loss_weight: tests whether LPL is helping or hurting

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Lorenz partial additive coupling, obs_noise=0.01, n_delays=60,
    prediction_steps=30, traj_init_steps=15, splitmode (most_recent traj
    + uniform recon), final_perm_identity=true, init_pca_basis=false,
    fixed LC=1e-4 (winner from prior LC sweep). 27-run validation grid:
    3 obs_noise_scale × 3 recon_w × 3 lpl_w.
  hypothesis: |
    Three orthogonal axes around the proven-good config:
      - obs_noise_scale {0, 3e-3, 3e-2}: validate the in-flight 4-value
        sweep's expected signal at the winning cell.
      - reconstruction_loss_weight {0.3, 1, 3}: split-mode trajectory
        loss (most_recent) is typically larger than uniform recon —
        scaling recon up rebalances. Expect best at recon_w >= 1.
      - latent_prediction_loss_weight {0, 0.1, 1}: tests whether LPL is
        actively helping at this jointly-trained config. Memory says
        LPL=1 destroys loop closure for fixed-encoder; less clear for
        joint training. lpl_w=0 isolates the trajectory + recon + LC
        signal cleanly.
  success_criteria:
    - "All 27 runs train without divergence"
    - "Best val traj_loss is at most 2x worse than the winner's 3.98e-4"
    - "Identifies which axis matters most: obs_noise_scale, recon_w, or lpl_w"
    - "Best cell has selection_LC <= sqrt(n_target_dims) (passes C2)"

sweep_grid:
  training.lightning.obs_noise_scale: "0,3e-3,3e-2"
  training.lightning.reconstruction_loss_weight: "0.3,1,3"
  training.lightning.latent_prediction_loss_weight: "0,0.1,1"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDInitSweep_autodim_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_additive_uniformLC_p30_obsnoise001_nd60_init15_autodim_lc1em4__validation_3x3x3_sweep"

data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 60
      delay_spacing: 1

model:
  n_target_dims: 3                      # fallback; PCA-auto picked 5 for the winner
  n_target_var_threshold: 0.99
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0
  trajectory_loss_most_recent: true     # explicit (matches winner; insulates against future default flips)
  encoder:
    final_perm_identity: true
    init_pca_basis: false

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 1e-4             # winner's value, fixed
    loop_closure_training: true
    reconstruction_loss_weight: 1.0       # overridden by sweep_grid
    latent_prediction_loss_weight: 1.0    # overridden by sweep_grid
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0                  # overridden by sweep_grid
    n_eigval_jacobians: 8
    jacobianODEint_kwargs:
      traj_init_steps: 15
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
