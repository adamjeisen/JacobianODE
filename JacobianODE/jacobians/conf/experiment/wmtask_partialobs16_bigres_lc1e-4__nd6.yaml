# @package _global_
#
# WMTask partial-obs (32-channel fixed list, 16 per area, seed-42 resolved),
# n_delays=6, LC=1e-4 — all matched to the production gagriild run
# (wmtask_pobs16_cayley_top3nd_lcobs__stage_b, run_id gagriild,
# JacobianODE/WMTask_identity_encoder_verification). The ONE change
# from gagriild is the dynamics MLP: 8-layer × 4096-dim with residual
# connections (mirroring the Mary latent_norm_test "bigres" variant).
# Same loss weights, same data normalization (normalize=false +
# generalized_variance=0.019746), same observed-channel set as gagriild's
# config, so the bigres vs production comparison is apples-to-apples on
# everything except the dynamics module.

defaults:
  - override /data: wmtask_epoch_compare_partialobs16
  - override /model: latent_direct_sum_coupling
  - _self_

metadata:
  description: |
    Single-cell WMTask conditioned epoch-compare run (epoch=1 vs final),
    partial-obs 16-per-area at LC=1e-4 — matching the production
    chosen run gagriild
    (wmtask_pobs16_cayley_top3nd_lcobs__stage_b). The ONE deviation
    from gagriild is the dynamics MLP: 8-layer × 4096-dim with
    residual connections (mirroring the Mary latent_norm_test
    "bigres" variant that raised the latent-Jacobian temporal CV
    without breaking trajectory prediction).
  hypothesis: |
    On Mary-0818 the bigres residual MLP raised the post-hoc
    Jacobian temporal CV from ~5e-4 to ~0.06 — i.e. allowed the
    dynamics to drift further from a strict LTI map — while
    trajectory prediction loss got slightly BETTER, not worse. The
    open question is whether that more-expressive dynamics module
    still reproduces the per-pair reach / ctrl Gramian pattern of
    the ground-truth BiologicalRNN as cleanly as the baseline
    4-layer MLP did. WMTask is the cleanest test bed because the
    true Jacobian is known. Pass: bigres recovers the same
    sign-pattern + magnitude on the 4×4 directed-area Gramian grids
    vs the gagriild baseline, with similar or better R²/MASE.
  success_criteria:
    - "Cell trains 200 epochs without NaN train loss"
    - "Per-area autodim n_target_dims logged (gagriild had n_dyn=25 total)"
    - "Final val/trajectory_loss within 2× of gagriild's ~0.0035"
    - "val/jac_temporal_cv elevated above the baseline ~0 (indicates the
       residual capacity is actually being used)"
    - "Per-pair gramian sign pattern matches the gagriild baseline
       (qualitative — confirmed post-hoc from chosen_extras)"

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "wmtask_partialobs16_bigres_lc1e-4__nd6"

data:
  # Matched to the production gagriild run
  # (wmtask_pobs16_cayley_top3nd_lcobs__stage_b, JacobianODE/WMTask_identity_encoder_verification).
  postprocessing:
    obs_noise: 0.05
    filter_data: false
    normalize: false                      # gagriild: false
    generalized_variance: 0.019746232785335237   # gagriild
  train_test_params:
    seq_length: 35                        # = 15 traj_init + 20 prediction
    delay_embedding_params:
      # Exact 32-channel list from gagriild's config (16 per area, seed=42
      # resolved). Listed explicitly so we don't re-resolve and get a
      # different set.
      observed_indices: [0, 5, 9, 12, 13, 16, 25, 34, 36, 40, 44, 50, 52, 56, 58, 61, 66, 68, 82, 85, 90, 100, 101, 102, 108, 109, 115, 118, 119, 121, 126, 127]
      n_observed_per_area: [16, 16]
      partial_obs_seed: 42
      n_delays: 6
      delay_spacing: 1
    split_by: trajectory

model:
  n_target_dims: null                     # set by per-area PCA-auto
  n_target_var_threshold: 0.99
  prediction_steps: 20
  encoder_warmup_epochs: 0
  dynamics_warmup_epochs: 0
  use_vae: false
  kl_null_weight: null
  kl_dyn_weight: 0.0
  trajectory_loss_most_recent: true
  encoder:
    area_indices: "auto_partial_obs"
    n_target_dims_per_block: [16, 16]     # fallback; overridden by per-area PCA-auto
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3
    use_cayley_perms: true
    condition_dim: 1
  params:
    condition_dim: 1
    # The only architectural difference from the baseline sweep:
    # 8-layer × 4096-dim dynamics MLP with residual connections.
    hidden_dim: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
    num_layers: 8
    residuals: true

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 16
  trainer_params:
    max_epochs: 200
    limit_train_batches: 500
    limit_val_batches: 100
    accumulate_grad_batches: 4
  lightning:
    optimizer_kwargs:
      lr: 1.0e-4
      weight_decay: 1.0e-4
    scheduler_type: teacher_forcing
    k_scale: 1
    min_lr: 1.0e-6
    loss_func: mse
    loop_closure_weight: 1.0e-4           # gagriild: 1e-4 (production C1/C2 chosen)
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    shadow_patience: 2
    min_epochs: 10
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
