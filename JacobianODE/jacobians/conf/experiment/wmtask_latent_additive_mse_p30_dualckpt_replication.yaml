# @package _global_
#
# REPLICATION test: re-run the monolithic CouplingEncoder sweep at the
# best LC (1e-5) with dual checkpoint enabled (patience=5 + shadow=2).
# Single-cell, single-run.
#
# Two purposes:
#   (1) Sanity-check that nothing in the code has drifted since the
#       original wmtask_latent_additive_mse_p30__lc_sweep run — we should
#       reproduce i73jwojr's clean Lyapunov spectrum (Δλ_min ≈ +0.4
#       relative to empirical) at the es2-best.ckpt sidecar.
#   (2) Test whether ES5 vs ES2 changes the monolithic spectrum the way
#       it (apparently) changes DirectSum's. If es5-best of monolithic
#       ALSO becomes suppressed, then ES5 is part of the story; if not,
#       the es5-vs-es2 effect is DirectSum-specific.

defaults:
  - override /data: wmtask
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Single-run replication of the monolithic CouplingEncoder best cell
    (LC=1e-5, obs_noise_scale=0.05) with dual-checkpoint enabled
    (early_stopping_patience=5, shadow_patience=2). Same model + data
    + loss config as wmtask_latent_additive_mse_p30__lc_sweep modulo
    patience. Should reproduce that sweep's chosen-best Lyapunov
    behavior at the es2-best.ckpt sidecar.
  hypothesis: |
    es2-best.ckpt should match the original i73jwojr Lyapunov spectrum
    (clean negative tail, Δλ_min ≈ 0). If it doesn't, code has drifted.
    es5-best.ckpt may or may not match — if it ALSO degrades, then ES5
    over-training contributes to the suppression we see on DirectSum
    dualckpt; if it stays clean, the suppression is DirectSum-specific.
  success_criteria:
    - "Run trains without divergence"
    - "Both es2-best.ckpt and (epoch-best) best.ckpt saved"
    - "es2 Lyapunov spectrum matches empirical to within Δλ_min ≈ ±1"

sweep_grid:
  training.lightning.loop_closure_weight: "1e-5"

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "wmtask_latent_additive_mse_p30_dualckpt_replication"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: false
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: 'all'
      n_delays: 1
      delay_spacing: 1

model:
  n_target_dims: 128           # full latent, no null subspace
  prediction_steps: 30
  encoder_warmup_epochs: 0
  dynamics_warmup_epochs: 0
  use_vae: false
  vae_sample_all_losses: false
  kl_null_weight: null
  kl_dyn_weight: 0.0

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 16
  trainer_params:
    max_epochs: 1000
    limit_train_batches: 500
    limit_val_batches: 100
    accumulate_grad_batches: 4
  lightning:
    loss_func: mse
    loop_closure_weight: 1e-5
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    obs_noise_scale: 0.05
  early_stopping:
    early_stopping_patience: 5     # primary ES (was 2 in original sweep)
    shadow_patience: 2             # NEW — saves es2-best.ckpt sidecar
    min_epochs: 10
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
