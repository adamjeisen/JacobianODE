# @package _global_
#
# Lorenz partial (25 delays -> 3 latent), additive MSE, uniform loss,
# p30. Fixes loop_closure_weight at the best value from the prior LC
# sweep (1e-5, run z4l1eazh) and sweeps reconstruction_loss_weight
# to test whether tighter enforcement of the dyn-only reconstruction
# bottleneck closes the latent-Jacobian trace gap.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Same base as lorenz_partial_25d_additive_mse_uniform_p30. Fixes
    loop_closure_weight=1e-5 (best from the prior LC sweep, run
    z4l1eazh). Sweeps training.lightning.reconstruction_loss_weight
    over {1, 10, 100} to test whether pushing the dyn-only bottleneck
    residual smaller drags <tr(dg/dz)> toward the Lorenz divergence
    -13.67 and hence λ₃ toward -14.57.
  hypothesis: |
    For z4l1eazh, the full-latent cycle D(E(x))=x held at ~1e-8 but
    the dyn-only cycle D([E(x)_dyn, 0]) had ~0.7% RMS residual — so
    training data x_de does not lie exactly on the model's 3-D image
    manifold M = {D([z_dyn, 0])}. <tr(dg/dz)> came out at -10.05
    instead of -13.67, with non-constant trace including locally
    positive regions. The story: off-M slippage concentrates in the
    stable direction (loss-invisible) and softens λ₃.
    If increasing reconstruction_loss_weight genuinely pushes x_de
    onto M, we should see:
      - dyn-only reconstruction loss shrink with weight
      - <tr(dg/dz)> track toward -13.67
      - λ₃ approach -14.57
    If the trace gap is insensitive to reconstruction weight, the
    bottleneck-residual hypothesis is wrong and we need to look
    elsewhere (e.g. z_null regularization, Jacobian-net capacity,
    optimization dynamics).
  success_criteria:
    - "dyn-only reconstruction loss monotonically decreases with weight"
    - "<tr(dg/dz)> at recon_weight=100 is within 20% of -13.67"
    - "λ₃ at recon_weight=100 is more negative than at recon_weight=1"

sweep_grid:
  training.lightning.reconstruction_loss_weight: "1,10,100"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_N25_D1_NormTrue_T3__JacobianODE"
wandb_group: "lorenz_partial_25d_additive_mse_uniform_p30__recon_sweep"

data:
  postprocessing:
    obs_noise: 0.0
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 25
      delay_spacing: 1

model:
  n_target_dims: 3
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 1e-5            # fixed at prior best
    loop_closure_training: true
    reconstruction_loss_weight: 1.0      # overridden by sweep_grid
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
