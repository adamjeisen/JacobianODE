# @package _global_
#
# p30 sweep over the delay-embedding length (n_delays), with zero
# loop-closure weight, at obs_noise=0.05. Direct counterpart to the
# obsnoise001 n_delays sweep so we can see whether the optimal
# embedding depth shifts with noise level.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Lorenz partial additive coupling, uniform reconstruction loss,
    obs_noise=0.05, prediction_steps=30, loop_closure_weight=0.
    Sweeps delay_embedding_params.n_delays over [5, 10, 15, 20, 25,
    30, 35, 40, 45, 50]. n_target_dims fixed at 3; encoder.n_input
    is auto-resolved from n_delays × |observed_indices| at Hydra
    runtime.
  hypothesis: |
    The obs y7938e7x post-mortem suggested the 25-delay embedding may
    be sub-optimal at obs_noise=0.05 (overestimated |λ_min|). Larger
    n_delays effectively lower-passes more noise out of any single
    delay coordinate (each delay is one noisy point); smaller n_delays
    keeps the embedding tight but can't unfold the attractor cleanly.
    Expect the best n_delays at obs_noise=0.05 to be larger than at
    obs_noise=0.01.
  success_criteria:
    - "Clear minimum in best val traj_loss as a function of n_delays"
    - "Best n_delays at obs_noise=0.05 ≥ best n_delays at obs_noise=0.01"
    - "All runs converge (no training divergence regardless of n_delays)"

sweep_grid:
  data.train_test_params.delay_embedding_params.n_delays: "5,10,15,20,25,30,35,40,45,50"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDsweep_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_additive_mse_uniform_p30_obsnoise005__ndelays_sweep"

data:
  postprocessing:
    obs_noise: 0.05
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 25                        # overridden by sweep_grid
      delay_spacing: 1

model:
  n_target_dims: 3
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 0.0              # fixed at 0 for this sweep
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
