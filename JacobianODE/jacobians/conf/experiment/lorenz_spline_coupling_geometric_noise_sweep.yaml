# @package _global_
#
# Experiment: Lorenz × SplineCoupling + Geometric Noise — loop-closure / KL sweep
# ---------------------------------------------------------------------------------
# Encoder : spline_coupling (RQS, 8 coupling layers, VAE on dynamic subspace)
# Data    : Lorenz, fully observed (all 3 dims), 1 delay (no embedding)
# Latent  : 3D dynamic subspace, no null space
# Noise   : geometric_noise enabled (volume-preserving additive flow)
# Sweep   : loop_closure_weight × kl_dyn_weight  (9 × 9 = 81 combinations)
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=lorenz_spline_coupling_geometric_noise_sweep

defaults:
  - override /data: dysts
  - override /model: latent_spline_coupling
  - override /hydra/sweeper: grid_lc_kl
  - _self_

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

wandb_project: "Lorenz_INDall_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__JacobianODE"

wandb_group: "spline_coupling__geometric_noise__sweep_lc_x_kl_dyn"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      observed_indices: 'all'   # fully observed (all 3 Lorenz dims)
      n_delays: 1               # no delay embedding

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 3              # full 3D dynamic subspace, no null space
  prediction_steps: 30
  encoder_warmup_epochs: 5
  vae_sample_all_losses: true   # critical: downstream losses must see noisy z
  geometric_noise:
    enabled: true
    n_coupling_layers: 6
    hidden_dim: 128              # smaller for 3D latent
    n_hidden_layers: 2
    permutation_seed: 0

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 150
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    n_eigval_jacobians: 8        # number of validation samples for eigenvalue diagnostics
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 10

