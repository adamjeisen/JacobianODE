# @package _global_
#
# Single run: same base as lorenz_partial_25d_additive_mse_uniform_p30
# with LC=1e-5 (best from prior LC sweep) and reconstruction_loss_weight=100.
# Intended for ou_bcs_low after the mit_normal_gpu queue-starved run_idx=2
# of the original recon_sweep was cancelled. Uses a distinct wandb_group
# so the old 3-run sweep stays intact and this standalone run is reported
# separately.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Single-run companion of lorenz_partial_25d_additive_mse_uniform_p30_recon_sweep
    restricted to the largest reconstruction_loss_weight (100). Submitted
    on ou_bcs_low so it doesn't wait the 21h mit_normal_gpu backlog. The
    other two recon weights (1, 10) are running concurrently on
    mit_normal_gpu under the original wandb group. Together they let us
    test the bottleneck-residual → trace-gap hypothesis.
  hypothesis: |
    If tighter dyn-only reconstruction anchors the latent Jacobian trace,
    <tr(dg/dz)> should be visibly closer to the Lorenz divergence -13.67
    at recon_weight=100 than at 1 or 10.
  success_criteria:
    - "dyn-only reconstruction loss smaller than at recon_weight=1"
    - "<tr(dg/dz)> closer to -13.67 than the recon_weight=1 run"

sweep_grid: {}

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_N25_D1_NormTrue_T3__JacobianODE"
wandb_group: "lorenz_partial_25d_additive_mse_uniform_p30__recon100_obcslow"

data:
  postprocessing:
    obs_noise: 0.0
    normalize: true
  train_test_params:
    seq_length: 45
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 25
      delay_spacing: 1

model:
  n_target_dims: 3
  prediction_steps: 30
  kl_null_weight: 0.0
  kl_dyn_weight: 0.0

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 1e-5
    loop_closure_training: true
    reconstruction_loss_weight: 100
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
