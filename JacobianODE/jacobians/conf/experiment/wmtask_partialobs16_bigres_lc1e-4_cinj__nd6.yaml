# @package _global_
#
# Same as wmtask_partialobs16_bigres_lc1e-4__nd6 (the bigres rerun of
# the gagriild production run) but with the new
# `condition_inject_per_layer: true` flag — the condition vector ``c``
# is concatenated at the input of EVERY residual block, not just the
# first input layer. Tests whether deluting c across 8 layers in
# bigres is what caused the per-mode condition stability differential
# to flip (sign-match 3/27 vs production 27/29).

defaults:
  - override /data: wmtask_epoch_compare_partialobs16
  - override /model: latent_direct_sum_coupling
  - _self_

metadata:
  description: |
    Single-cell WMTask conditioned epoch-compare run, partial-obs
    16-per-area at LC=1e-4 — matched to gagriild config (the production
    partial-obs chosen run, group
    wmtask_pobs16_cayley_top3nd_lcobs__stage_b). Dynamics MLP = 8-layer ×
    4096 with residual connections AND with
    `condition_inject_per_layer: true`: c (the single condition scalar)
    is re-concatenated at the input of every residual block. Diff from
    the existing bigres run (wmtask_partialobs16_bigres_lc1e-4__nd6 /
    fzy2sasy): only condition_inject_per_layer flips False→True.
  hypothesis: |
    On partial-obs WMTask the previous bigres flipped the per-mode
    condition stability differential (sign-match 3/27 vs production
    27/29). One hypothesis: c is only injected at the input layer in
    the legacy bigres, so by the time it reaches the J output it has
    been diluted across 8 residual blocks. With per-layer c injection
    the model can't separate c-dependent J structure from state-
    dependent J structure as easily, so the per-cond Jacobian
    structure may be forced to be more consistent. Pass: sign-match
    closer to production's 27/29 (≥20), with comparable or better
    trajectory loss vs the no-cinj bigres.
  success_criteria:
    - "Cell trains without NaN train loss."
    - "Per-mode sign-match between predicted Δ Lyapunov (c=-1 - c=+1) and empirical Δ ≥ production's 27/29, or at least substantially above the no-cinj bigres' 3/27."
    - "val/trajectory_loss within 2× of fzy2sasy's ~2e-3."
    - "val/jac_temporal_cv reported."

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "wmtask_partialobs16_bigres_lc1e-4_cinj__nd6"

data:
  postprocessing:
    obs_noise: 0.05
    filter_data: false
    normalize: false
    generalized_variance: 0.019746232785335237
  train_test_params:
    seq_length: 35
    delay_embedding_params:
      observed_indices: [0, 5, 9, 12, 13, 16, 25, 34, 36, 40, 44, 50, 52, 56, 58, 61, 66, 68, 82, 85, 90, 100, 101, 102, 108, 109, 115, 118, 119, 121, 126, 127]
      n_observed_per_area: [16, 16]
      partial_obs_seed: 42
      n_delays: 6
      delay_spacing: 1
    split_by: trajectory

model:
  n_target_dims: null
  n_target_var_threshold: 0.99
  prediction_steps: 20
  encoder_warmup_epochs: 0
  dynamics_warmup_epochs: 0
  use_vae: false
  kl_null_weight: null
  kl_dyn_weight: 0.0
  trajectory_loss_most_recent: true
  encoder:
    area_indices: "auto_partial_obs"
    n_target_dims_per_block: [16, 16]
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3
    use_cayley_perms: true
    condition_dim: 1
  params:
    condition_dim: 1
    hidden_dim: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
    num_layers: 8
    residuals: true
    condition_inject_per_layer: true   # *** THE one diff from fzy2sasy ***

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 16
  trainer_params:
    max_epochs: 200
    limit_train_batches: 500
    limit_val_batches: 100
    accumulate_grad_batches: 4
  lightning:
    optimizer_kwargs:
      lr: 1.0e-4
      weight_decay: 1.0e-4
    scheduler_type: teacher_forcing
    k_scale: 1
    min_lr: 1.0e-6
    loss_func: mse
    loop_closure_weight: 1.0e-4
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    shadow_patience: 2
    min_epochs: 10
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
