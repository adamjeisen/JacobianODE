# @package _global_
#
# WMTask partial-obs (16 random channels/area, seed=42), n_delays=6, LC=1e-4
# — same chosen parameters as the production run (gagriild) — but with
# the new latent_pred_target_stopgrad=True flag (detach the encoder-side
# TARGET of latent_pred_loss when obs_noise_scale==0, so gradients from
# that loss flow only through the predicted path, matching BYOL/SimSiam
# target-network convention).
#
# Production dynamics MLP is unchanged (the 4-layer 256/1024/2048/2048
# plain MLP, residuals=false). The only deviation from gagriild is the
# stopgrad flag.

defaults:
  - override /data: wmtask_epoch_compare_partialobs16
  - override /model: latent_direct_sum_coupling
  - _self_

metadata:
  description: |
    Single-cell WMTask partial-obs run mirroring gagriild (production
    chosen partial-obs run, group wmtask_pobs16_cayley_top3nd_lcobs__stage_b)
    on every knob EXCEPT latent_pred_target_stopgrad: False → True.
    Same data setup (observed_indices from seed=42-resolved gagriild
    config, n_delays=6, generalized_variance=0.019746, normalize=false),
    same loss weights (LC=1e-4, obs_noise_scale=0), same dynamics MLP
    (production 4-layer plain).
  hypothesis: |
    A code-comment in latent_jacobian.py notes that a single-cell test
    on Mary-Anesthesia-20160818-02 with this flag flipped to True
    lifted val/jac_temporal_cv ~10x and val/loop_closure_loss ~70x
    without degrading trajectory val_loss — the cleaner gradient flow
    moves the latent away from the near-LTI degeneracy. Test whether
    that effect carries to WMTask partial-obs and whether it changes
    the per-mode condition stability differential (gagriild baseline
    is 27/29 sign-match). Pass: trajectory val_loss within 2x of
    gagriild's 0.0035; val/jac_temporal_cv well above 0 (target-stopgrad
    actually lifting the encoder-side flatness); per-mode sign-match
    reported.

wandb_entity: JacobianODE
wandb_project: "WMTask_identity_encoder_verification"
wandb_group: "wmtask_partialobs16_stopgradtarget__nd6"

data:
  postprocessing:
    obs_noise: 0.05
    filter_data: false
    normalize: false
    generalized_variance: 0.019746232785335237
  train_test_params:
    seq_length: 35
    delay_embedding_params:
      observed_indices: [0, 5, 9, 12, 13, 16, 25, 34, 36, 40, 44, 50, 52, 56, 58, 61, 66, 68, 82, 85, 90, 100, 101, 102, 108, 109, 115, 118, 119, 121, 126, 127]
      n_observed_per_area: [16, 16]
      partial_obs_seed: 42
      n_delays: 6
      delay_spacing: 1
    split_by: trajectory

model:
  n_target_dims: null
  n_target_var_threshold: 0.99
  prediction_steps: 20
  encoder_warmup_epochs: 0
  dynamics_warmup_epochs: 0
  use_vae: false
  kl_null_weight: null
  kl_dyn_weight: 0.0
  trajectory_loss_most_recent: true
  encoder:
    area_indices: "auto_partial_obs"
    n_target_dims_per_block: [16, 16]
    final_perm_identity: true
    zero_init: true
    near_identity_std: 1.0e-3
    use_cayley_perms: true
    condition_dim: 1
  params:
    condition_dim: 1
    # Production dynamics MLP (NOT bigres):
    hidden_dim: [256, 1024, 2048, 2048]
    num_layers: 4
    residuals: false

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 16
  trainer_params:
    max_epochs: 200
    limit_train_batches: 500
    limit_val_batches: 100
    accumulate_grad_batches: 4
  lightning:
    optimizer_kwargs:
      lr: 1.0e-4
      weight_decay: 1.0e-4
    scheduler_type: teacher_forcing
    k_scale: 1
    min_lr: 1.0e-6
    loss_func: mse
    loop_closure_weight: 1.0e-4
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0
    n_eigval_jacobians: 8
    latent_pred_target_stopgrad: true       # *** the one diff from gagriild ***
  early_stopping:
    early_stopping_patience: 5
    shadow_patience: 2
    min_epochs: 10
    early_stopping_mode: 'percent_thresh'
    percent_thresh: 0.01
