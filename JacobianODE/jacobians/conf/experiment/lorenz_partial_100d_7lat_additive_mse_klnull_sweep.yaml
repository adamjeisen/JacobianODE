# @package _global_
#
# Lorenz partial obs (x only, 100 delays) -> 7-D z_dyn, additive coupling,
# plain MSE — kl_null_weight sweep at the best-LC from the earlier LC sweep
# (loop_closure_weight=1e-3).
#
# Tests the sufficient-statistic hypothesis: does pushing z_null toward
# structureless force the encoder to surface trajectory history into z_dyn,
# concentrate the real strong-contraction direction into a single axis, and
# pull λ_min closer to the empirical ~−14 than the zero-kl_null run's ~−6.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Same as lorenz_partial_100d_7lat_additive_mse except
    loop_closure_weight is FIXED at 1e-3 (best LC from the LC sweep)
    and kl_null_weight is SWEPT over {0, 1e-4, 1e-3, 1e-2, 1e-1, 1}.
    Every other knob identical. obs_noise_scale=0, reconstruction_mode
    = most_recent, prediction_steps=10, seq_length=25.
  hypothesis: |
    With z_null unpenalised, the encoder dumps trajectory history into
    z_null and the Jacobian MLP spreads contraction across the 7
    z_dyn axes (λ_min ≈ −6 instead of empirical ~−14). A positive
    kl_null_weight should force information into z_dyn, tighten the
    attractor manifold in z_dyn, and concentrate contraction into
    a single axis whose λ moves toward empirical. Risk: too-large
    kl_null suppresses z_null below what the decoder needs to
    reconstruct observations — recon_loss explodes, trajectory
    fidelity collapses. Expecting a U-shape in spectrum MSE vs
    kl_null with a sweet spot somewhere in 1e-3 .. 1e-1.
  success_criteria:
    - "At the best kl_null, λ_min moves noticeably more negative than −6"
    - "Σλ_i (volume-contraction rate) moves from −20 toward empirical ~−14"
    - "val/trajectory_r2 at best kl_null within a few % of the 0-kl_null baseline"
    - "Clear U-shape (or monotone direction) across the 6 kl_null values"

sweep_grid:
  model.kl_null_weight: "0,1e-4,1e-3,1e-2,1e-1,1"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_N100_D1_NormTrue_T7__JacobianODE"
wandb_group: "lorenz_partial_100d_7lat_additive_mse__klnull_sweep"

data:
  postprocessing:
    obs_noise: 0.0
    normalize: true
  train_test_params:
    seq_length: 25
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 100
      delay_spacing: 1

model:
  n_target_dims: 7
  prediction_steps: 10
  kl_null_weight: 0.0                      # overridden by sweep_grid
  kl_dyn_weight: 0.0

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 0.001             # FIXED at best-LC from the LC sweep
    loop_closure_training: true
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 1.0
    reconstruction_mode: 'most_recent'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
