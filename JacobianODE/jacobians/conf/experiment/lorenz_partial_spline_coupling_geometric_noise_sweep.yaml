# @package _global_
#
# Experiment: Lorenz × SplineCoupling + Geometric Noise — loop-closure / KL sweep
# ---------------------------------------------------------------------------------
# Encoder : spline_coupling (RQS, 8 coupling layers, VAE on dynamic subspace)
# Data    : Lorenz, fully observed (all 3 dims), 1 delay (no embedding)
# Latent  : 3D dynamic subspace, no null space
# Noise   : geometric_noise enabled (volume-preserving additive flow)
# Sweep   : loop_closure_weight × kl_dyn_weight  (9 × 9 = 81 combinations)
#
# Launch:
#   python -m JacobianODE.jacobians.run_jacobians --multirun \
#     experiment=lorenz_spline_coupling_geometric_noise_sweep

defaults:
  - override /data: dysts
  - override /model: latent_spline_coupling
  - override /hydra/sweeper: grid_lc_kl
  - _self_

metadata:
  description: |
    Lorenz with PARTIAL observation (dim 0 only) + delay embedding, spline
    coupling encoder with geometric_noise, 3D dynamic subspace. Sweeps
    loop_closure_weight × kl_dyn_weight (81 runs). Tests whether the latent
    model can recover 3D dynamics from a 1D observable + delays.
  hypothesis: |
    Given an overcomplete delay embedding of a 1D observable, the encoder
    should route the underlying 3D dynamic state into z_dyn and the
    redundant delays into the null space. Trajectory prediction and
    Lyapunov spectrum should approach ground truth.
  success_criteria:
    - "λ₁ estimate matches Lorenz ground truth within ~20%"
    - "Sum of estimated Lyapunov exponents correctly negative"
    - "At least one config learns the attractor structure"

# ── W&B / logging ─────────────────────────────────────────────────────────────
wandb_entity: JacobianODE

wandb_project: "Lorenz_IND${data.train_test_params.delay_embedding_params.observed_indices}_N${data.train_test_params.delay_embedding_params.n_delays}_D${data.train_test_params.delay_embedding_params.delay_spacing}_Norm${data.postprocessing.normalize}_T${model.n_target_dims}__JacobianODE"

wandb_group: "spline_coupling__geometric_noise__sweep_lc_x_kl_dyn_${model.prediction_steps}step_cleantarget"

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45     # traj_init_steps(15) + prediction_steps(30)
    delay_embedding_params:
      # observed_indices: 'all'   # fully observed (all 3 Lorenz dims)
      # n_delays: 1               # no delay embedding
      observed_indices: [0]   # dim 0 only (Lorenz x-coordinate)
      n_delays: 25            # 25-step delay embedding -> 25D input
      delay_spacing: 1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  n_target_dims: 3              # full 3D dynamic subspace, no null space
  prediction_steps: 30
  encoder_warmup_epochs: 5
  vae_sample_all_losses: true   # critical: downstream losses must see noisy z
  geometric_noise:
    enabled: true
    n_coupling_layers: 6
    hidden_dim: 128              # smaller for 3D latent
    n_hidden_layers: 2
    permutation_seed: 0

# ── Training ──────────────────────────────────────────────────────────────────
training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 150
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    n_eigval_jacobians: 8        # number of validation samples for eigenvalue diagnostics
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 10

