# @package _global_
#
# Encoder-only KL sweep at obs_noise=0.01, n_delays=75. Trains an additive
# coupling encoder (PCA-basis init) with ONLY reconstruction + KL losses —
# no dynamics, no trajectory rollout, no loop closure. Picks the kl_dyn ×
# kl_null combination that minimizes val/recon_loss.

defaults:
  - override /data: dysts
  - override /model: latent_additive_coupling
  - _self_

metadata:
  description: |
    Lorenz partial additive coupling, obs_noise=0.01, n_delays=75,
    traj_init_steps=15 (only governs dataloader seq_length, not training).
    encoder_only_mode=true → training + validation skip all dynamics work
    and use only recon + KL losses. init_pca_basis=true → encoder starts
    as the PCA rotation V. use_vae=true so kl_dyn_weight has teeth.
    12-run sweep: 6 kl_dyn_weight × 2 kl_null_weight.
    Analytics includes the new tangent_spectrum section: per-point latent
    tangents (z_{t+1} - z_t) projected onto encoder Jacobian columns,
    ranked by magnitude, averaged over val set. For the true 3-dim Lorenz
    attractor, we expect the top 3 components to carry most of the energy.
  hypothesis: |
    With PCA-basis init the encoder already reconstructs cleanly. The KL
    regularizers shape the latent geometry: kl_null pushes z_null → 0,
    concentrating representation on z_dyn; kl_dyn (VAE Gaussian KL on
    z_dyn) encourages smooth/Gaussian latent codes. Too much kl_dyn will
    collapse the latent entirely; too little gives no shaping benefit.
    Prior: best val/recon_loss at small-to-mid kl_dyn (~1e-4 to 1e-2),
    kl_null=0 (let z_null stay untouched since PCA already picked the
    right subspace). The tangent_spectrum should concentrate on the top
    3 directions at every KL weight, since Lorenz is intrinsically 3-dim
    — this is a check on the encoder, not on the KL choice.
  success_criteria:
    - "All 12 runs train without divergence (val/recon_loss finite throughout)"
    - "Best val/recon_loss achieved at some kl_dyn in {1e-4, 1e-3, 1e-2}"
    - "Top 3 components of the tangent spectrum at the best run carry >= 95% of energy"
    - "Cumulative tangent energy at dim 3 is higher than at the worst run"

sweep_grid:
  model.kl_dyn_weight: "0,1e-4,1e-3,1e-2,1e-1,1"
  model.kl_null_weight: "null,0"

wandb_entity: JacobianODE
wandb_project: "Lorenz_INDpartial_NDInitSweep_autodim_D1_NormTrue__JacobianODE"
wandb_group: "lorenz_partial_additive_encoderonly_nd75_init15_pcainit_autodim__kl_sweep_obsnoise001"

data:
  postprocessing:
    obs_noise: 0.01
    normalize: true
  train_test_params:
    seq_length: 45                       # traj_init_steps (15) + prediction_steps (30)
    delay_embedding_params:
      observed_indices: [0]
      n_delays: 75
      delay_spacing: 1

model:
  n_target_dims: 3                       # fallback; overridden by PCA-auto
  n_target_var_threshold: 0.99           # PCA-auto picks k as first k s.t. cum_var >= 0.99
  prediction_steps: 30                   # unused (no dynamics) but kept for config compatibility
  kl_null_weight: 0.0                    # overridden by sweep_grid
  kl_dyn_weight: 0.0                     # overridden by sweep_grid
  use_vae: true                          # required for kl_dyn_weight > 0 to take effect
  vae_sample_all_losses: false
  kl_warmup_epochs: 0
  trajectory_loss_most_recent: false     # irrelevant with no trajectory; explicit for clarity
  encoder_only_mode: true                # key flag: skip all dynamics work
  encoder:
    final_perm_identity: false
    init_pca_basis: true                 # encoder = V @ x at init (V = PCA basis)

training:
  logger_save_dirs: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  logger:
    save_dir: /orcd/data/ekmiller/001/eisenaj/JacobianODE/lightning/latent_jac_runs
  batch_size: 32
  trainer_params:
    max_epochs: 200
    limit_train_batches: 200
    limit_val_batches: 50
    accumulate_grad_batches: 1
  lightning:
    loss_func: mse
    loop_closure_weight: 0.0              # no dynamics → no LC
    loop_closure_training: false
    reconstruction_loss_weight: 1.0
    latent_prediction_loss_weight: 0.0    # no dynamics → no latent pred
    trajectory_training: false            # explicit; encoder_only_mode already suppresses it
    reconstruction_mode: 'uniform'
    obs_noise_scale: 0.0
    n_eigval_jacobians: 8                 # unused (no dynamics Jacobians)
    jacobianODEint_kwargs:
      traj_init_steps: 15
  early_stopping:
    early_stopping_patience: 5
    min_epochs: 20
