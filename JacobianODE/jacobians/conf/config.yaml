defaults:
  - _self_
  - training: training
  - data: dysts
  - model: mlp
  - slurm: default
  - override hydra/sweeper: list  # required for --multirun with comma-separated values


logger: wandb
wandb_entity: JacobianODE
wandb_project: null
wandb_group: null  # Optional: group runs into separate experiments within the same project

# Optuna pruning (passed to trainer via top-level config)
optuna_study_name: null  # set by notebook when running Optuna sweep
optuna_storage: null      # e.g. "sqlite:///path/to/optuna.db"

hydra:
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  # mode: MULTIRUN
  job:
    chdir: True
