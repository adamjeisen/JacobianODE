params:
  _target_: JacobianODE.models.mlp.MLP
  input_dim: null    # = n_target_dims, set at runtime
  hidden_dim: [256, 1024, 2048, 2048]
  num_layers: 4
  output_dim: null   # = n_target_dims², set at runtime
  residuals: False
  dropout: 0.0
  activation: 'silu'

encoder:
  _target_: JacobianODE.fnn.coupling_flows.SplineAutoregressiveEncoder
  n_input: null            # set at runtime (= n_delays * len(observed_indices))
  n_layers: 8              # number of autoregressive layers
  hidden_dim: 128          # MADE hidden width
  n_hidden_layers: 2       # MADE depth
  num_bins: 8              # rational quadratic spline segments
  tail_bound: 3.0          # linear tails outside [-B, B]
  use_actnorm: true        # ActNorm between autoregressive layers
  zero_init: true          # identity initialization trick
  permutation_seed: 42      # base seed for inter-layer permutations
  use_loft: false
  loft_tau: 100.0

n_target_dims: 3           # drives MLP dims and subspace splitting
kl_null_weight: null        # null-space MSE penalty (structural constraint)
kl_dyn_weight: 0.0         # dynamic subspace KL divergence (smoothness regularizer)
use_vae: true             # VAE reparameterization on dynamic subspace
vae_sample_all_losses: false  # when false, only recon uses sampled z_dyn
kl_warmup_epochs: 0        # 0 = fixed weight, >0 = linear ramp from 0
prediction_steps: 30
encoder_warmup_epochs: 0
dynamics_warmup_epochs: 0
jac_window_stride: null
decode_only_recent: false

# Geometric noise: learned volume-preserving map f: z_dyn -> u that warps
# isotropic noise in u-space into dynamics-aware anisotropic noise in z-space.
# Requires use_vae: true.
geometric_noise:
  enabled: false
  n_coupling_layers: 6        # number of additive coupling layers in f
  hidden_dim: 128              # hidden width of the conditioner MLPs inside each coupling layer
  n_hidden_layers: 2           # depth of conditioner MLPs
  permutation_seed: 0
