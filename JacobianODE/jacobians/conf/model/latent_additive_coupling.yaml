# Latent JacobianODE with an additive (NICE-style) coupling encoder.
#
# Additive coupling is volume-preserving by construction (det(J)=1) and has
# a lower-triangular per-layer Jacobian with unit diagonal, so the decoder
# Jacobian stays well-conditioned (cond ≈ 1) and gradients flow cleanly
# from observation-space losses back to the Jacobian MLP. This makes it
# the preferred encoder for dynamics training, especially when paired
# with a trainable encoder + latent prediction loss.
#
# Use-agnostic defaults are identical to latent_spline_coupling.yaml where
# possible; the only structural difference is coupling_type and the
# removal of spline-specific knobs (num_bins, tail_bound).

params:
  _target_: JacobianODE.models.mlp.MLP
  input_dim: null    # = n_target_dims, set at runtime
  hidden_dim: [256, 1024, 2048, 2048]
  num_layers: 4
  output_dim: null   # = n_target_dims², set at runtime
  residuals: False
  dropout: 0.0
  activation: 'silu'

encoder:
  _target_: JacobianODE.fnn.coupling_flows.CouplingEncoder
  n_input: null              # set at runtime (= n_delays * len(observed_indices))
  n_coupling_layers: 8
  coupling_type: additive    # NICE-style translation only; volume-preserving
  use_actnorm: false         # per-dim affine; can break volume preservation if trained
  hidden_dim: 128
  n_hidden_layers: 2
  zero_init: true            # identity at init (only dimension permutations remain)
  permutation_seed: 42
  use_loft: false
  loft_tau: 100.0
  # When true (combined with zero_init), the entire encoder is the identity
  # at init, so z_dyn = z[..., :n_target_dims] = the n_target_dims most
  # recent observations deterministically (independent of permutation_seed).
  # Inter-layer permutations are still fully random — only a final fixed
  # permutation is added to cancel their composition. No expressivity cost.
  final_perm_identity: false
  # When true, append a fixed orthogonal Q at the end such that, at init,
  # the encoder maps x -> V @ x where V is the PCA basis of the noisy
  # training delay embeddings (computed by run_jacobians and injected at
  # construction). z_dyn = z[..., :n_target_dims] is then the top
  # n_target_dims PCs of the input. Mutually exclusive with
  # final_perm_identity. Same expressivity as either alternative — only
  # the starting point of training differs.
  init_pca_basis: false

n_target_dims: 7              # drives MLP dims and subspace splitting
# If set (float in (0, 1]), n_target_dims is auto-picked at data-load time
# as the smallest k such that the first k PCs of the noisy training
# delay-embeddings capture ≥ threshold of the total variance. Overrides
# whatever n_target_dims was configured statically.
n_target_var_threshold: null
# When true, the trajectory (rollout) training loss uses
# reconstruction_mode='most_recent' regardless of the training-level
# reconstruction_mode (see training.lightning.reconstruction_mode). This
# matches what validation already hardcodes, so train and val both penalize
# the same quantity (the live-frame forecast) while reconstruction_mode
# stays as-configured for the encoder-decoder round-trip loss. Default True
# (matched); flip to False to reproduce the pre-fix "both use
# self.reconstruction_mode" behaviour.
trajectory_loss_most_recent: true
kl_null_weight: null          # null-space MSE penalty (structural constraint)
kl_dyn_weight: 0.0            # dynamic subspace KL divergence (smoothness regularizer)
use_vae: false                # deterministic latent by default; flip on when you need VAE
vae_sample_all_losses: false
kl_warmup_epochs: 0
prediction_steps: 30
encoder_warmup_epochs: 0      # additive+zero_init is already identity, no warmup needed
dynamics_warmup_epochs: 0
jac_window_stride: null
decode_only_recent: false

# Geometric noise: learned volume-preserving map f: z_dyn -> u that warps
# isotropic noise in u-space into dynamics-aware anisotropic noise in z-space.
# Requires use_vae: true.
geometric_noise:
  enabled: false
  n_coupling_layers: 6
  hidden_dim: 128
  n_hidden_layers: 2
  permutation_seed: 0

# Jacobian noise: parameter-free volume-preserving noise routing using the
# Jacobian MLP. Requires use_vae: true. Mutually exclusive with geometric_noise.
jacobian_noise:
  enabled: false
  lookahead_steps: null
  orthogonalize: true
