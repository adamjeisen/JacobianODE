batch_size: 32
run_number: 0

lightning:
  _target_: JacobianODE.encoder_only.model.LitEncoderDecoder

  # -----------------
  # OPTIMIZATION
  # -----------------
  optimizer: 'AdamW'
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-4
  use_scheduler: True
  min_lr: 1e-6
  lr_scheduler_patience: 10
  lr_scheduler_factor: 0.5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: 'norm'

  # -----------------
  # DECODER OBJECTIVE WEIGHTS
  # -----------------
  same_state_weight: 1.0   # weight for decode(z_t) ≈ x_t
  next_state_weight: 1.0   # weight for decode(z_t) ≈ x_{t+1} (only if use_next_state_decoder)

  # -----------------
  # REGULARISATION WEIGHTS
  # -----------------
  # Set to 0 to disable; >0 to enable with that weight
  fnn_weight: 0.0           # FNN latent-geometry regulariser (Gilpin NeurIPS 2020)
  fnn_normalize: false      # Normalize FNN loss by activation variance
  fnn_elementwise_regularization: false  # Elementwise FNN: E[W*A^2] vs E[W]*E[A^2]
  fnn_use_pca: true        # Project onto PCA before FNN for rotation invariance
  fnn_n_samples: 1024      # Max points for FNN (O(N²)); null = use all
  fnn_sparsify: false      # Penalize L1 norm of embedding for sparse latent dimensions
  amplification_weight: 0.0 # Noise amplification regulariser
  decov_weight: 0.0         # DeCov off-diagonal covariance penalty (Cogswell ICLR 2016)
  jacobian_nuclear_weight: 0.0  # Nuclear norm of encoder Jacobian (mean of singular values per point)
  jacobian_nuclear_n_samples: 256  # Max points for Jacobian nuclear loss; null = use all
  tangent_entropy_weight: 0.0     # Tangent space entropy: concentrate latent dynamics along fewer SVD directions
  tangent_entropy_n_samples: 256  # Max points for tangent entropy Jacobian computation; null = use all
  tangent_entropy_mode: 'quadratic'  # Entropy formula: 'shannon', 'quadratic', or 'renyi_half'

  # Advanced: amplification regulariser settings
  amplification_n_neighbors: 10
  amplification_max_T: 5


logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: null
  log_model: True

trainer_params:
  limit_train_batches: 500
  limit_val_batches: 100
  max_epochs: 1000
  accumulate_grad_batches: 4

early_stopping:
  min_epochs: 0  # Training runs at least this many epochs before early stopping can trigger
  early_stopping_patience: 5
  early_stopping_mode: 'percent_thresh'
  percent_thresh: 0.005
  monitor: 'mean val loss'
  mode: 'min'

model_checkpoint:
  save_top_k: 1
  monitor: 'mean val loss'
  mode: 'min'
